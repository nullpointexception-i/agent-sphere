apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agent-sphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: crpi-beo82etap5e8va9b.cn-wulanchabu.personal.cr.aliyuncs.com/nullpointexception-i/agent-sphere-backend:sha-b9d13cb
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: backend-config
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 1.5Gi
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: agent-sphere
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
