apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-sphere
  namespace: agent-sphere
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - as.buukle.top
    secretName: as-buukle-top-tls
  rules:
  - host: as.buukle.top
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
