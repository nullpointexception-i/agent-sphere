apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agent-sphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: crpi-beo82etap5e8va9b.cn-wulanchabu.personal.cr.aliyuncs.com/nullpointexception-i/agent-sphere-frontend:sha-3e1a6e1
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: agent-sphere
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
