name: Build & Deploy to k3s

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Default is 6 hours; a stuck push must not burn that silently. After splitting
    # the build into layers, a normal run should finish in minutes.
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        # Build the commit the tag points to, not main.
        # The image tag uses GITHUB_SHA. If main has not advanced to that commit yet
        # (for example, a tag was pushed after a failed main push), the build would
        # produce an image named vN but containing the old code — production run 2962
        # was built from the 169 code in exactly this way (V115 did not run).
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Verify build commit is reachable from main
      run: |
        git fetch origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::$GITHUB_SHA is not on origin/main; refusing to build a release image from it"
          exit 1
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Aliyun ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.ACR_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Generate image tag
      id: tag
      run: echo "sha=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - name: Build & push backend
      uses: docker/build-push-action@v6
      with:
        context: agent-sphere
        push: true
        tags: ${{ vars.ACR_REGISTRY }}/agent-sphere-backend:${{ steps.tag.outputs.sha }}
        cache-from: type=gha
        cache-to: type=gha
        provenance: false
        sbom: false
      env:
        # buildx collapses progress by default, so layer pushes can sit on one line
        # for a long time. plain prints per-layer byte counts, which distinguishes
        # "slow cross-border push" from "genuinely stuck".
        BUILDKIT_PROGRESS: plain

    - name: Build & push frontend
      uses: docker/build-push-action@v6
      with:
        context: agent-sphere-ui
        push: true
        build-args: COMMIT_HASH=${{ steps.tag.outputs.sha }}
        tags: ${{ vars.ACR_REGISTRY }}/agent-sphere-frontend:${{ steps.tag.outputs.sha }}
        cache-from: type=gha
        cache-to: type=gha
        provenance: false
        sbom: false
      env:
        # buildx collapses progress by default, so layer pushes can sit on one line
        # for a long time. plain prints per-layer byte counts, which distinguishes
        # "slow cross-border push" from "genuinely stuck".
        BUILDKIT_PROGRESS: plain

    - name: Build & push widget
      uses: docker/build-push-action@v6
      with:
        context: agent-sphere-copilot-widget
        push: true
        tags: ${{ vars.ACR_REGISTRY }}/agent-sphere-widget:${{ steps.tag.outputs.sha }}
        cache-from: type=gha
        cache-to: type=gha
        provenance: false
        sbom: false
      env:
        # buildx collapses progress by default, so layer pushes can sit on one line
        # for a long time. plain prints per-layer byte counts, which distinguishes
        # "slow cross-border push" from "genuinely stuck".
        BUILDKIT_PROGRESS: plain

    - name: Update k8s manifests with new image tags
      run: |
        TAG="${{ steps.tag.outputs.sha }}"
        REGISTRY="${{ vars.ACR_REGISTRY }}"
        sed -i "s|image: .*/agent-sphere-backend:.*|image: ${REGISTRY}/agent-sphere-backend:${TAG}|" k8s/05-backend.yaml
        sed -i "s|image: .*/agent-sphere-frontend:.*|image: ${REGISTRY}/agent-sphere-frontend:${TAG}|" k8s/06-frontend.yaml
        sed -i "s|image: .*/agent-sphere-widget:.*|image: ${REGISTRY}/agent-sphere-widget:${TAG}|" k8s/08-widget.yaml

    - name: Commit & push to trigger Fleet
      run: |
        git config user.name "AgentSphere Bot"
        git config user.email "bot@agentsphere.dev"
        git add k8s/05-backend.yaml k8s/06-frontend.yaml k8s/08-widget.yaml
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: update image tags [skip ci]"
          git pull --rebase origin main
          # checkout is at the tag commit (detached HEAD), so a plain git push fails.
          # Push explicitly to main; otherwise Git reports
          # "You are not currently on a branch" (the v1.0.171 release failed this way).
          git push origin HEAD:main
        fi

    - name: Package Chrome Extension
      run: |
        mkdir -p output
        TAG="${{ github.ref_name }}"
        VER="${TAG#v}"     # Strip the leading v.
        VER="${VER%-*}"    # Strip the -alpha/-beta suffix to a numeric dotted version
                           # (required by Chrome extension versioning).
        cd agent-sphere-chrome-extension
        # Replace the manifest/package version with the numeric tag version for this
        # checkout only; the change is not committed back to the repository.
        sed -i "s|\"version\": *\"[^\"]*\"|\"version\": \"${VER}\"|" manifest.json package.json
        zip -r ../output/agent-sphere-chrome-extension-${TAG}.zip \
          manifest.json background.js lib content.js content-locator.js content-editors.js \
          page-script.js inject.js popup.html popup.js offscreen.html offscreen.js \
          icon-16.png icon-32.png icon-48.png icon-128.png

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: output/agent-sphere-chrome-extension-${{ github.ref_name }}.zip
        generate_release_notes: true
