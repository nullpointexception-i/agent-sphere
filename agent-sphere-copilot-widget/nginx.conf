server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived immutable asset caching (build outputs are content-hashed / versioned by release)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # brotli（fholzer/nginx-brotli 提供 ngx_brotli 模块）；gzip 保留作兜底
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
