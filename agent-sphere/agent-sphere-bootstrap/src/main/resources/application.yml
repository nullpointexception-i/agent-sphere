server:
  port: 8080                                       # Server port

spring:
  application:
    name: agent-sphere
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/buukle_agent_2026061101
    username: ${DB_USERNAME:buukle}
    password: ${DB_PASSWORD:buukle123}
    driver-class-name: org.postgresql.Driver
  redis:
    host: ${REDIS_HOST:127.0.0.1}                  # Redis host
    port: ${REDIS_PORT:6379}                       # Redis port
  threads:
    virtual:
      enabled: ${ENABLE_VIRTUAL_THREADS:true}      # Enable virtual threads (Java 21+)
  flyway:
    enabled: true                                  # Enable Flyway migration
    locations: classpath:db/migration               # Migration scripts location
    baseline-on-migrate: true                       # Auto-baseline an existing DB
    baseline-version: 0                             # Baseline version
    # Allow re-running migrations that were resolved but are missing or out of order in history (for example, recovering from V47/V51 history-row drift in production);
    # V47 (3-arg normalization) / V51 (setval + IF EXISTS guard) are idempotent, so re-running is safe. Once the history is repaired, consider switching back to false.
    out-of-order: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss               # JSON date format
    time-zone: Asia/Shanghai                        # Time zone
    serialization:
      fail-on-empty-beans: false                    # Don't fail on empty beans
  servlet:
    multipart:
      max-file-size: 110MB                          # Max single file upload size
      max-request-size: 120MB                       # Max request size

mybatis-plus:
  type-handlers-package: com.buukle.agent.infrastructure.handler
  configuration:
    map-underscore-to-camel-case: true              # Underscore to camel case
  global-config:
    db-config:
      logic-delete-field: delete_flag               # Logical delete field
      logic-delete-value: 1                         # Deleted value
      logic-not-delete-value: 0                     # Not deleted value
      id-type: auto                                 # ID strategy: auto-increment

logging:
  level:
    com.buukle: DEBUG                              # Framework log level
    com.buukle.agent.instance.repository: WARN      # SQL log level (WARN recommended in production)
    com.buukle.agent.model.repository: WARN         # Model SQL log level
    com.buukle.agent.capability: WARN               # Capability log level
    com.buukle.agent.tasks.repository: WARN         # Tasks SQL log level
    com.buukle.agent.completions.repository: WARN   # Completions SQL log level
    com.buukle.agent.sso.repository: WARN           # SSO SQL log level
    com.buukle.agent.admin.repository: WARN         # Admin SQL log level
    com.buukle.agent.superagent.repository.AgentEventDeliveryMapper: INFO
    com.buukle.agent.superagent.repository.AgentOutboundMessageMapper: INFO
    com.buukle.agent.superagent.repository.AgentWorkItemMapper: INFO
    com.buukle.agent.superagent.repository.AgentEventMapper: INFO
    org.springframework: INFO                       # Spring framework log

buukle:
  agent:
    # ============================================================
    # Super-Agent / group-level dispatch
    # The Group Router runs through the normal runtime on the tenant's current instance.
    # ============================================================
    super-agent:
      enabled: true
      group-router:
        enabled: true
        run-timeout-ms: 60000                      # Max wait for one router run before retrying the batch
        batch:
          interval-ms: 3000                        # Scheduling interval
          max-events: 20                           # Max events per batch
          max-wait-ms: 3000                        # Batch accumulation wait window
          max-chars: 12000                         # Max characters per batch
        retry:
          max-attempts: 5
          base-backoff-ms: 3000
      agent-router:
        enabled: true
        interval-ms: 5000                          # Fallback polling interval (the main path is millisecond wake-up on transaction-commit events; this only covers lost events / work left hanging by a restart)
        batch-size: 20                             # Deliveries per batch
        max-loop-count: 64                         # Agent Router loop limit per run
      router:
        default-model-route-id: 0
        stream:
          enabled: true                            # Master switch for runtime → IM SSE real-time streaming
          thinking-enabled: true                   # Whether to push model thinking chunks
          coalesce-ms: 50                          # Chunk coalescing window
          max-chunk-chars: 256                     # Max characters per coalesced chunk
          session-cache-ttl-seconds: 600           # sessionId → Router session cache
          target-cache-ttl-seconds: 300            # threadId → chat target cache
          buffer-ttl-seconds: 600                  # Reclaim buffers leaked by runs with no terminal state
        reply:
          auto-final-enabled: true                 # Automatically write the final answer text of normal Q&A to outbound
          final-max-chars: 8000                    # Max characters for automatic final replies
      worker:
        enabled: true
        interval-ms: 3000                          # Scheduling interval
        max-concurrent: 5                          # Concurrent in-flight Workers
        max-concurrent-scope: REPLICA              # REPLICA | GLOBAL (cluster-wide quota)
        max-active-per-agent: 8                    # In-flight cap per employee
        queue-capacity: 200                        # Queue capacity
        default-loop-limit: 128                    # Default Worker loop limit
        batch-size: 5                              # Claims per batch
        dispatch-timeout-minutes: 10               # Reclaim threshold for stuck DISPATCHING
      event:
        retention-days: 30
        retention-cron: "0 30 3 * * ?"
      retention:
        batch-size: 500
        max-batches: 40
        batch-sleep-ms: 200
      outbound:
        enabled: true
        interval-ms: 5000                          # Fallback polling interval (the main path is millisecond wake-up on outbound-insert events)
        batch-size: 20                             # Messages sent per batch
        max-attempts: 8                            # Max retry attempts
        retry-base-ms: 2000                        # Backoff base
        lease-seconds: 900                         # Send lease; must exceed the maximum channel send time
      watchdog:
        enabled: true
        interval-ms: 60000
        stale-minutes: 15
        batch-size: 500
        max-batches: 20
        batch-sleep-ms: 100
    # ============================================================
    # Built-in IM
    # ============================================================
    im:
      enabled: true
      retention-days: 180
      retention-cron: "0 0 4 * * ?"
      max-message-chars: 8000
      max-attachment-mb: 20
      rate-limit-per-minute: 30
    # ============================================================
    # Session Config
    # cleanup-* are tuning parameters for historical session cleanup (SessionCleanupTask).
    # Retention days and the kill switch live in the system config table (config_group='session', see SystemConfigKeys), so changes need no redeploy.
    # Cleanup hard-deletes and is irreversible: logical delete frees no disk space, and large columns stay in the heap table.
    # ============================================================
    session:
      idle-timeout: 30m                            # Session idle timeout
      max-concurrent-runs: 10                      # Max concurrent runs
      cache-ttl: 60m                               # Context cache TTL
      cleanup-cron: "0 30 4 * * ?"                 # Session cleanup cron (off-peak)
      cleanup-batch-size: 200                      # Sessions per cleanup batch
      cleanup-max-batches: 50                      # Max batches per cleanup run (shared by cascade and standalone cleanup)
      cleanup-batch-sleep-ms: 200                  # Sleep between cleanup batches, yielding to autovacuum

    # ============================================================
    # Step Config
    # ============================================================
    step:
      max-retries: 3                               # Step max retries
      execution-timeout: 5m                        # Step execution timeout

    # ============================================================
    # SSE Config
    # ============================================================
    sse:
      buffer-size: 1024                            # SSE buffer size (bytes)
      cache-ttl: 30s                               # SSE event cache TTL
      heartbeat-interval: 15s                      # SSE heartbeat interval

    # ============================================================
    # Chrome Tool (all write actions go through CDP trusted input; no execution-mode switch)
    # ============================================================
    chrome:
      extension-token: ""

    # ============================================================
    # LLM Config
    # ============================================================
    llm:
      log-body-max-length: 128                     # LLM request body log truncation
      connect-timeout: 30s                         # LLM API connect timeout
      read-timeout: 60s                            # LLM API read timeout
      stream-read-timeout: 120s                    # Stream read timeout
      stream-header-timeout: 10s                   # Stream header + TLS handshake timeout
      stream-timeout: 600s                         # Stream total timeout (including thinking); long documents / large outputs need a bigger budget
      stream-max-retries: 2                        # Stream transient-failure (chunks=0) retry count
      stream-retry-delay: 1s                       # Stream retry fixed backoff fallback
      stream-retry-delays:                         # Stream retry backoff ladder
        - 300ms
        - 1s
      # Unified reasoning effort: global thresholds + per-provider supported ranges.
      # Provider/route config only overrides; the default level is derived from the actual max_tokens.
      reasoning:
        answer-reserve-ratio: 0.25                 # Answer reserve ratio
        min-answer-tokens: 1024                    # Min answer tokens
        min-thinking-budget: 1024                  # Min Qwen thinking_budget
        default-max-level: high                    # Default level ceiling (users can still pick a higher level)
        level-order:                               # Level order (low to high)
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        levels:                                    # Global level thresholds (minimum output budget)
          none:
            min-output-tokens: 0
          minimal:
            min-output-tokens: 2048
          low:
            min-output-tokens: 4096
          medium:
            min-output-tokens: 8192
          high:
            min-output-tokens: 16384
          xhigh:
            min-output-tokens: 32768
          max:
            min-output-tokens: 65536
        default-levels: [low, medium, high, max]
        providers:                                 # Provider defaults
          deepseek:
            supported: true
            mode: levels
            levels: [none, low, high, max]
          openai:
            supported: true
            mode: levels
            levels: [minimal, low, medium, high]
          glm:
            supported: true
            mode: levels
            levels: [low, high, max]
          qwen:
            supported: true
            mode: levels
            levels: [none, low, medium, high, max]
            thinking-budget-supported: true
          orcarouter:
            supported: true
            mode: levels
            levels: [low, medium, high]
          cheaperinference:
            supported: true
            mode: levels
            levels: [low, medium, high]

    # ============================================================
    # Runner Config
    # ============================================================
    runner:
      max-loop-count: 128                          # Max loop count per run
      task-max-loop-count: 2000                     # Higher loop limit for task-triggered runs (long sourcing/collect tasks)
      max-reasoning-chars: 500000                   # Max persisted reasoning length per run (characters)
      turn-timeout: 660s                           # Single LLM turn timeout; must be greater than llm.stream-timeout
      llm-turn-max-retries: 3                      # Per-turn LLM retry count on failure (not cancellation), exponential backoff 1s→2s→4s
      # Graded backoff for transient LLM failures (connect timeout / 5xx / 429): the first N rungs retry in place, the rest suspend (WAITING)
      # and are later woken by the wait scheduler to re-run the same turn, using no execution resources.
      # Sawtooth design: 1,3,10,15,20 then back to 1,3,15,20; 25 rungs in total (about 244s cumulative).
      llm-retry-ladder:
        - 1s
        - 3s
        - 10s
        - 15s
        - 20s
        - 1s
        - 3s
        - 15s
        - 20s
        - 1s
        - 3s
        - 15s
        - 20s
        - 1s
        - 3s
        - 15s
        - 20s
        - 1s
        - 3s
        - 15s
        - 20s
        - 1s
        - 3s
        - 15s
        - 20s
      llm-retry-inline-rungs: 2                    # Inline rung count before suspending
      llm-retry-jitter: 0.2                        # Jitter (±20%) for suspended rungs so runs are not woken at the same time
      llm-retry-max-total: 5m                      # Total retry window from the first failure
      max-screenshots-per-run: 20                  # Max browser screenshot observations injected per run (to avoid burning tokens)
      live-tool-result-max-chars: 4000              # Per-message cap for live non-browser tool results
      live-tool-result-budget-chars: 50000          # Total budget for live non-browser tool results
      live-tool-result-keep-recent: 2               # Recent non-browser results always kept
      live-browser-full-max-chars: 20000            # Full-text cap for a single browser result; larger results become callId references
      compaction:
        budget-ratio: 0.85                          # Compaction trigger ratio (fraction of maxInputTokens)
        target-ratio: 0.25                          # Post-compaction target (including tools/fixed overhead)
        adaptive-target-enabled: true               # Raise the target automatically when fixed overhead + tail cannot fit
        min-tail-tokens: 2000                       # Minimum tokens the adaptive target reserves for the tail
        input-ratio: 0.35                           # Compaction input budget ratio
        tail-ratio: 0.25                            # Run-local tail budget ratio
        summary-max-tokens: 10000                   # Summary absolute cap (tokens)
        summary-compress-rounds: 3                  # Max summary re-compression rounds when over the cap
        summary-max-ratio: 0.12                     # Summary cap as a fraction of maxInput
        cooldown-turns: 4                           # Compaction cooldown turns
        max-per-run: 12                             # Max compactions per run
        # Context tiers only define "when to compact"; the output cap comes from the model route / instance config.
        # trigger = maxInput - max(512, 5%) - 8000, leaving 8k of output headroom at the trigger point.
        # Linear interpolation between tiers; beyond the last tier, extrapolate using its ratio.
        tiers:
          - max-input-tokens: 32000
            trigger-tokens: 22400
          - max-input-tokens: 64000
            trigger-tokens: 52800
          - max-input-tokens: 128000
            trigger-tokens: 113600
          - max-input-tokens: 256000
            trigger-tokens: 235200
          - max-input-tokens: 512000
            trigger-tokens: 478400
          - max-input-tokens: 1000000
            trigger-tokens: 942000

    # ============================================================
    # Tool Config
    # ============================================================
    tool:
      max-parallel: 3                              # Max parallel tool executions
      submit-timeout: 30s                          # Tool submit timeout
      execution-timeout: 60s                       # Tool execution timeout
      cli-timeout: 30s                             # CLI tool timeout
      call-reason-enabled: true                    # Inject the tool call reason as _reason

      # The web-read / web-fetch / web-read-advanced / web-fetch-advanced / js-render blocks below
      # bind to fields such as ToolConfig.webRead. They were once mis-indented under wait:, which has no
      # matching @ConfigurationProperties target, so the keys were silently ignored and the code used
      # the in-class defaults — identical then, so nothing surfaced. When changing values here, confirm they are under tool:.
      # ---- Web Read Tool ----
      web-read:
        connect-timeout: 10s                       # Connect timeout
        read-timeout: 30s                          # Read timeout
      web-fetch:
        connect-timeout: 10s                       # Connect timeout
        read-timeout: 30s                          # Read timeout

      # ---- Jina AI Advanced Web Read ----
      web-read-advanced:
        use-jina-fallback: true                     # Enable Jina Reader fallback
        jina-reader-url: "https://r.jina.ai/"      # Jina Reader service URL
        jina-api-key: ""
        jina-engine: "direct"                      # Jina engine mode (direct/browser)
        jina-connect-timeout: 30                   # Jina connect timeout (s)
        jina-read-timeout: 30                      # Jina read timeout (s)
        jina-timeout-buffer: 10                    # Jina timeout buffer (s)
        html-to-markdown:
          max-content-length: 2097152              # Max HTML→Markdown length (bytes)
          exclude-tags: "script,style,noscript,meta,link,header,footer,nav,iframe,embed,object"

      # ---- Web Fetch Advanced ----
      web-fetch-advanced:
        max-retries: 3                             # Max retries
        retry-backoff-multiplier: 2                # Retry backoff multiplier
        retry-delay-ms: 1000                       # Initial retry delay (ms)
        max-redirects: 5                           # Max redirects
        max-response-bytes: 5242880                # Max response body (bytes)

      # ---- JS Render Config ----
      js-render:
        enabled: true                              # Enable JS rendering
        max-wait-millis: 10000                     # Max wait time (ms)
        background-js-timeout: 3000                # Background JS timeout (ms)
        max-pool-size: 3                           # Browser pool max size

    # ============================================================
    # Wait Tool (suspend-resume)
    # Only the three keys wake-cron / reconcile-* (read directly via @Value / @Scheduled, not through @ConfigurationProperties)
    # ============================================================
    wait:
      # Wake compensation sweep cron. The main path is one in-memory timer per wait record;
      # replica restarts/deploys lose every timer, so this layer falls back to wake_at (CAS prevents duplicate resumes).
      wake-cron: "*/10 * * * * ?"                   # Wait wake compensation sweep
      # Stuck-WAITING reconcile: find runs still WAITING past the threshold with no PENDING record and push them forward again; set a terminal state on failure.
      reconcile-interval: "PT30S"                   # Stuck-WAITING reconcile interval
      reconcile-stale-minutes: 11                   # Stale threshold in minutes (must be > MAX_WAIT_MS=10)

    # ============================================================
    # Controller Log Config
    # ============================================================
    controller-log:
      max-param-length: 200                         # Request param log truncation
      max-result-length: 300                        # Response result log truncation
      full-prefixes: /api/v1/api                    # Requests matching these prefixes log params/results in full (no truncation); comma separated

    # ============================================================
    # MCP Config
    # ============================================================
    mcp:
      connect-timeout: 30s                         # MCP connect timeout
      sse-init-timeout: 30s                        # MCP SSE init timeout
      sse-read-timeout: 30s                        # MCP SSE read timeout
      rpc-timeout: 30s                             # MCP RPC timeout
      detection-timeout: 10s                       # MCP service detection timeout
      direct-read-timeout: 30s                     # MCP direct read timeout
      direct-connect-timeout: 10s                  # MCP direct connect timeout

    # ============================================================
    # Lock Config
    # ============================================================
    # ============================================================
    # Chrome Extension Config
    # ============================================================


    # ============================================================
    # Crypto Config
    # ============================================================
    crypto:
      aes-key: ""

    lock:
      capability:
        wait-time: 5s                              # Lock acquire wait timeout
        lease-time: 10s                            # Lock lease duration

    # ============================================================
    # Audit Config
    # ============================================================
    audit:
      frontend-retention-days: 7                    # Frontend event retention days
      backend-retention-days: 90                    # Backend event retention days
      cleanup-cron: "0 0 3 * * ?"                   # Cleanup cron expression

    # ============================================================
    # Distributed runtime (multi-replica)
    # ============================================================
    distributed:
      owner-lease: 5m                              # Session executor owner lease
      orphan-sweep-interval: 30s                    # Orphan run sweep interval

    # ============================================================
    # Stale RUNNING reconcile
    # Scan by DB updated_at: still RUNNING past the threshold and the session has no owner (no replica running) → FAILED.
    # Catches "loop exited abnormally without writing a terminal state" — Redis state is already IDLE then, so orphan-sweep cannot see it.
    # The threshold must exceed the worst-case single turn (4 LLM retries + a compaction call); default 30m.
    # ============================================================
    run:
      stale-reconcile-minutes: 30                  # Stale threshold in minutes
      stale-reconcile-interval: PT1M               # Reconcile interval

# ============================================================
# Capability Open Platform
# ============================================================
hri-ai:
  completions:
    call-timeout: 60s                              # Completions call timeout
  tasks:
    poll-interval: 2s                              # Task poll interval
    max-poll-seconds: 3600                         # Fallback seconds when the caller does not specify
    min-timeout-seconds: 10800                     # Timeout floor (3h): explicit caller values below this are raised to the floor
                                                 # Callers typically pass 3600 and it is already persisted, so changing max-poll-seconds has no effect; observed max duration 9818s
    callback:
      max-attempts: 3                              # Max terminal-state callback attempts
      initial-delay: 2s                            # Task callback retry initial delay
