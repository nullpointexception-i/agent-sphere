server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html 每次重新校验，部署后立即拿到新的 hashed chunk 引用
        add_header Cache-Control "no-cache";
    }

    # 构建产物为内容 hash 命名，可安全长缓存
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
