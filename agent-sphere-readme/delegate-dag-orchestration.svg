<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .box-title { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="740" fill="url(#bg)"/>

  <text x="50" y="60" class="title">Multi-Agent DAG Orchestration — delegate</text>
  <text x="50" y="88" class="box-text">Kahn-layered parallel lanes · ContactEnvelope data injection · bounded retries · per-key reconciliation</text>

  <!-- 父级入口 -->
  <rect x="420" y="120" width="360" height="96" rx="18" fill="#ffffff" filter="url(#shadow)" stroke="#94a3b8"/>
  <rect x="444" y="138" width="100" height="40" rx="20" fill="#334155"/>
  <text x="494" y="164" class="pill" text-anchor="middle">Parent</text>
  <text x="556" y="158" class="box-title">delegate(goal, mode)</text>
  <text x="556" y="182" class="mono">mode=subagent · tasks[]</text>

  <path d="M600,216 L600,246" class="line"/>

  <!-- 编排器 -->
  <rect x="360" y="248" width="480" height="76" rx="18" fill="#fff7ed" stroke="#f59e0b" filter="url(#shadow)"/>
  <text x="388" y="278" class="box-title">Orchestrator — Kahn layering + cycle check</text>
  <text x="600" y="304" class="mono" text-anchor="middle">reject cycle · reject unknown dep key</text>

  <!-- 三列泳道 -->
  <path d="M380,324 L380,356" class="line"/>
  <path d="M600,324 L600,356" class="line"/>
  <path d="M820,324 L820,356" class="line"/>

  <!-- L0 泳道 -->
  <rect x="160" y="358" width="240" height="92" rx="16" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1"/>
  <rect x="182" y="376" width="150" height="34" rx="17" fill="#818cf8"/>
  <text x="257" y="398" class="pill" text-anchor="middle">L0 · lane a</text>
  <text x="280" y="430" class="mono" text-anchor="middle">{key:"a", goal, args}</text>

  <!-- L1 泳道（依赖 a） -->
  <rect x="480" y="358" width="240" height="92" rx="16" fill="#ffffff" filter="url(#shadow)" stroke="#4db6ac" stroke-width="2"/>
  <rect x="502" y="376" width="150" height="34" rx="17" fill="#14b8a6"/>
  <text x="577" y="398" class="pill" text-anchor="middle">L1 · lane b</text>
  <text x="600" y="430" class="mono" text-anchor="middle">dependsOn:["a"]</text>

  <!-- L2 泳道（依赖 b） -->
  <rect x="800" y="358" width="240" height="92" rx="16" fill="#ffffff" filter="url(#shadow)" stroke="#f59e0b" stroke-width="2"/>
  <rect x="822" y="376" width="150" height="34" rx="17" fill="#f59e0b"/>
  <text x="897" y="398" class="pill" text-anchor="middle">L2 · lane c</text>
  <text x="920" y="430" class="mono" text-anchor="middle">dependsOn:["b"]</text>

  <!-- 依赖箭头 -->
  <path d="M400,404 L480,404" class="line"/>
  <path d="M720,404 L800,404" class="line"/>

  <!-- 泳道注入说明 -->
  <text x="280" y="470" class="small" text-anchor="middle">ContactEnvelope:{key,args,upstream}</text>
  <text x="600" y="470" class="small" text-anchor="middle">injected via extra user msg</text>
  <text x="920" y="470" class="small" text-anchor="middle">awaits upstream deliver</text>

  <path d="M600,486 L600,516" class="line"/>

  <!-- 重试 -->
  <rect x="300" y="518" width="600" height="78" rx="18" fill="#fef2f2" stroke="#ef4444" filter="url(#shadow)"/>
  <text x="330" y="548" class="box-title">tryRetryFailed — bounded retries (maxDagRetries)</text>
  <text x="600" y="576" class="mono" text-anchor="middle">re-dispatch UNCERTAIN/ERROR/empty lanes · replay original args</text>

  <path d="M600,596 L600,626" class="line"/>

  <!-- 聚合 -->
  <rect x="340" y="628" width="520" height="82" rx="18" fill="#ffffff" filter="url(#shadow)" stroke="#334155"/>
  <text x="368" y="656" class="box-title">Aggregation envelope — per-key reconciliation</text>
  <text x="600" y="684" class="code" text-anchor="middle">{mode, overall:{total,ok,failed,failedKeys}, results[k]}</text>
  <text x="367" y="708" class="small">missing/failed lane → UNCERTAIN + re-run (framework never infers)</text>
</svg>
