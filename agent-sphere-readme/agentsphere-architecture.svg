<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 52px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .subtitle { font: 400 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .layer-title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .small { font: 500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg)"/>

  <text x="95" y="105" class="title">AgentSphere 编排</text>
  <text x="95" y="150" class="subtitle">源码视角：LLM 决策、ReAct 循环、统一工具分发、浏览器桥接、记忆压缩与模型容错</text>

  <rect x="90" y="205" width="1420" height="170" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="125" y="254" class="layer-title">1. User Interface Layer</text>
  <rect x="135" y="280" width="390" height="64" rx="13" fill="#e8f1ff" stroke="#7aa7e8"/>
  <text x="160" y="320" class="box-title">AgentSphere Web UI</text>
  <rect x="590" y="280" width="420" height="64" rx="13" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="615" y="320" class="box-title">Chrome Extension Popup</text>
  <rect x="1075" y="280" width="360" height="64" rx="32" fill="#475569"/>
  <text x="1140" y="320" class="pill">HTTP / SSE 实时事件</text>
  <text x="145" y="360" class="small">聊天、运行详情、记忆、工具调用、模型与能力管理</text>
  <text x="710" y="360" class="small">连接状态、页面跟随、操作日志、浏览器回调</text>

  <path d="M800 376 L800 425" class="line"/>

  <rect x="90" y="425" width="1420" height="310" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="125" y="475" class="layer-title">2. Runtime Layer：ReAct Kernel + Orchestration</text>
  <rect x="135" y="515" width="300" height="135" rx="14" fill="#fff4e6" stroke="#f0ad4e"/>
  <text x="165" y="552" class="box-title">SessionRunner</text>
  <text x="165" y="585" class="box-text">Plan → Act → Observe → Learn</text>
  <text x="165" y="617" class="box-text">循环、取消、超时、压缩重组</text>
  <rect x="485" y="515" width="300" height="135" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text x="515" y="552" class="box-title">KernelLlmService</text>
  <text x="515" y="585" class="box-text">流式 text / reasoning</text>
  <text x="515" y="617" class="box-text">识别 tool_calls 并记录交互</text>
  <rect x="835" y="515" width="300" height="135" rx="14" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="865" y="552" class="box-title">FiberSet</text>
  <text x="865" y="585" class="box-text">并发执行多个工具调用</text>
  <text x="865" y="617" class="box-text">submit / awaitAll / cancel</text>
  <rect x="1185" y="515" width="300" height="135" rx="14" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="1215" y="552" class="box-title">Runtime Events</text>
  <text x="1215" y="585" class="box-text">PENDING / RUNNING / DONE</text>
  <text x="1215" y="617" class="box-text">前端实时展示与审计</text>
  <path d="M435 582 L485 582" class="line"/>
  <path d="M785 582 L835 582" class="line"/>
  <path d="M1135 582 L1185 582" class="dash"/>
  <text x="145" y="700" class="small">源码落点：SessionRunner.run / runTurn、FiberSet、RuntimeEventListener、SseManager</text>

  <path d="M800 736 L800 785" class="line"/>

  <rect x="90" y="785" width="1420" height="260" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="125" y="835" class="layer-title">3. Capability Layer：ToolExecutor 统一分发</text>
  <rect x="135" y="875" width="280" height="92" rx="14" fill="#e8f1ff" stroke="#7aa7e8"/>
  <text x="165" y="913" class="box-title">MCP</text>
  <text x="165" y="944" class="box-text">Jira / GitHub / DB / Cloud</text>
  <rect x="465" y="875" width="280" height="92" rx="14" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="495" y="913" class="box-title">Builtin SPI</text>
  <text x="495" y="944" class="box-text">WebFetch / Chrome / Todo</text>
  <rect x="795" y="875" width="280" height="92" rx="14" fill="#fff4e6" stroke="#f0ad4e"/>
  <text x="825" y="913" class="box-title">CLI</text>
  <text x="825" y="944" class="box-text">ProcessBuilder 执行命令</text>
  <rect x="1125" y="875" width="280" height="92" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text x="1155" y="913" class="box-title">Skill</text>
  <text x="1155" y="944" class="box-text">多步任务与跨系统流程</text>
  <rect x="500" y="990" width="700" height="36" rx="18" fill="#334155"/>
  <text x="850" y="1015" class="pill" text-anchor="middle">ToolExecutor 根据 capabilityType 路由到 MCP / Builtin / CLI / Skill</text>

  <path d="M800 1046 L800 1095" class="line"/>

  <rect x="90" y="1095" width="1420" height="190" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="125" y="1145" class="layer-title">4. Chrome Bridge：从工具调用到真实浏览器操作</text>
  <rect x="135" y="1180" width="330" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="165" y="1223" class="box-title">ChromeCommandDTO</text>
  <rect x="635" y="1180" width="330" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="665" y="1223" class="box-title">Chrome Extension</text>
  <rect x="1135" y="1180" width="330" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1165" y="1223" class="box-title">ChromeCallbackDTO</text>
  <path d="M465 1215 L635 1215" class="line"/>
  <path d="M965 1215 L1135 1215" class="line"/>
  <text x="145" y="1270" class="small">navigate / getContent / click / type / executeJS；ChromePendingStore 等待回调并处理 30s 超时</text>

  <path d="M800 1286 L800 1335" class="line"/>

  <rect x="90" y="1335" width="670" height="180" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="125" y="1384" class="layer-title">5. Data / Memory Layer</text>
  <text x="145" y="1422" class="box-text">HistoryLoader 回放 user / assistant / tool messages</text>
  <text x="145" y="1455" class="box-text">ToolCallRecord 保存 callId、参数、artifact、状态</text>
  <text x="145" y="1488" class="box-text">Compaction 超预算后写摘要，再重组上下文</text>

  <rect x="840" y="1335" width="670" height="180" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="875" y="1384" class="layer-title">6. Model Layer</text>
  <text x="895" y="1422" class="box-text">RouteListBuilder 解析 primary + fallback 模型链</text>
  <text x="895" y="1455" class="box-text">FallbackRouteExecutor 主路由失败后自动切换</text>
  <text x="895" y="1488" class="box-text">Provider SPI 支持 OpenAI / DeepSeek / 自定义供应商</text>
</svg>
