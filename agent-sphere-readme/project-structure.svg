<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1400" viewBox="0 0 1100 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
      .branch { stroke:#94a3b8; stroke-width:2.2; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="1400" fill="url(#bg)"/>

  <text x="40" y="58" class="title">Project Structure</text>
  <text x="40" y="86" class="small">Three independent projects · backend / Chrome extension / Web UI</text>

  <rect x="140" y="120" width="820" height="1224" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="170" y="165" class="layer-title">Repository Layout · Project Structure</text>

  <rect x="170" y="190" width="190" height="36" rx="18" fill="#7aa7e8"/>
  <text x="265" y="213" class="pill" text-anchor="middle">agent-sphere/ · Backend</text>
  <rect x="380" y="190" width="320" height="36" rx="18" fill="#f0ad4e"/>
  <text x="540" y="213" class="pill" text-anchor="middle">agent-sphere-chrome-extension/ · Extension</text>
  <rect x="720" y="190" width="200" height="36" rx="18" fill="#818cf8"/>
  <text x="820" y="213" class="pill" text-anchor="middle">agent-sphere-ui/ · UI</text>

  <rect x="170" y="246" width="760" height="1068" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="184" y="260" width="5" height="748" rx="2.5" fill="#7aa7e8"/>
  <rect x="184" y="1030" width="5" height="132" rx="2.5" fill="#f0ad4e"/>
  <rect x="184" y="1184" width="5" height="110" rx="2.5" fill="#818cf8"/>
  <text x="206" y="276" class="mono">agent-sphere/                         # Backend main project</text>
  <text x="206" y="298" class="mono">├── agent-sphere-bootstrap/           # App bootstrap entry</text>
  <text x="206" y="320" class="mono">├── agent-sphere-common/              # Shared library (config, exceptions, utils)</text>
  <text x="206" y="342" class="mono">├── agent-sphere-infrastructure/      # Infrastructure (AOP, auth)</text>
  <text x="206" y="364" class="mono">├── agent-sphere-instance/            # Instance / session management</text>
  <text x="206" y="386" class="mono">│   ├── controller/                   #   API controllers</text>
  <text x="206" y="408" class="mono">│   ├── service/                      #   business logic</text>
  <text x="206" y="430" class="mono">│   ├── repository/                   #   data access</text>
  <text x="206" y="452" class="mono">│   └── domain/                       #   domain models</text>
  <text x="206" y="474" class="mono">├── agent-sphere-model/               # Model management</text>
  <text x="206" y="496" class="mono">│   ├── provider/                     #   LLM providers</text>
  <text x="206" y="518" class="mono">│   ├── route/                        #   route management</text>
  <text x="206" y="540" class="mono">│   └── api-key/                      #   API Key</text>
  <text x="206" y="562" class="mono">├── agent-sphere-capability/          # Capability layer (extensible)</text>
  <text x="206" y="584" class="mono">│   ├── builtin/                      #   builtin tool SPI</text>
  <text x="206" y="606" class="mono">│   │   ├── tool-chrome/              #     Chrome browser actions</text>
  <text x="206" y="628" class="mono">│   │   ├── tool-webfetch/            #     HTTP web fetch</text>
  <text x="206" y="650" class="mono">│   │   ├── tool-webread/             #     web page reading</text>
  <text x="206" y="672" class="mono">│   │   └── tool-todowrite/           #     todo task management</text>
  <text x="206" y="694" class="mono">│   ├── mcp/                          #   MCP protocol (Jira/GitHub/DB...)</text>
  <text x="206" y="716" class="mono">│   ├── cli/                          #   CLI execution</text>
  <text x="206" y="738" class="mono">│   └── skill/                        #   composite skills</text>
  <text x="206" y="760" class="mono">├── agent-sphere-runtime/             # Runtime engine</text>
  <text x="206" y="782" class="mono">│   ├── kernel/                       #   core execution</text>
  <text x="206" y="804" class="mono">│   │   ├── runner/                   #     SessionRunner</text>
  <text x="206" y="826" class="mono">│   │   ├── async/                    #     FiberSet</text>
  <text x="206" y="848" class="mono">│   │   ├── service/                  #     CompactionService</text>
  <text x="206" y="870" class="mono">│   │   └── tool/                     #     ToolExecutor</text>
  <text x="206" y="892" class="mono">│   └── orchestration/                #   orchestration layer</text>
  <text x="206" y="914" class="mono">│       ├── sse/                      #     SSE Manager</text>
  <text x="206" y="936" class="mono">│       ├── chrome/                   #     Chrome command handler</text>
  <text x="206" y="958" class="mono">│       └── handler/                  #     RuntimeEventListener</text>
  <text x="206" y="980" class="mono">├── agent-sphere-util/                # Utilities</text>
  <text x="206" y="1002" class="mono">└── pom.xml                           # Parent POM</text>
  <text x="206" y="1046" class="mono">agent-sphere-chrome-extension/        # Chrome extension (independent project)</text>
  <text x="206" y="1068" class="mono">├── manifest.json                     # Extension config</text>
  <text x="206" y="1090" class="mono">├── background.js                     # Service Worker — SSE + command routing</text>
  <text x="206" y="1112" class="mono">├── content.js                        # Content Script — DOM manipulation + Toast</text>
  <text x="206" y="1134" class="mono">├── popup.html / popup.js             # Status panel (Info/Settings/Logs)</text>
  <text x="206" y="1156" class="mono">└── icon-128.png                      # Icon</text>
  <text x="206" y="1200" class="mono">agent-sphere-ui/                      # Web UI (independent project, UmiJS)</text>
  <text x="206" y="1222" class="mono">├── src/</text>
  <text x="206" y="1244" class="mono">│   ├── pages/chat/                   # Chat page</text>
  <text x="206" y="1266" class="mono">│   └── services/agentSphere/         # API client</text>
  <text x="206" y="1288" class="mono">└── package.json</text>
</svg>
