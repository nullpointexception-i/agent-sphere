<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="780" viewBox="0 0 1250 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
      .branch { stroke:#94a3b8; stroke-width:2.2; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1250" height="780" fill="url(#bg)"/>

  <text x="40" y="58" class="title">Session Following</text>
  <text x="40" y="86" class="small">Content Script polls auth · path change triggers SSE reconnect · new tabs forward tabId</text>

  <rect x="485" y="110" width="280" height="48" rx="24" fill="#334155"/>
  <text x="625" y="140" class="pill" text-anchor="middle">Content Script → checkAuth polling</text>

  <path d="M625,158 L625,188" class="branch"/>
  <path d="M320,188 L930,188" class="branch"/>
  <path d="M320,188 L320,210" class="branch"/>
  <path d="M930,188 L930,210" class="branch"/>

  <rect x="40" y="210" width="560" height="510" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="70" y="255" class="layer-title">Path Following</text>

  <rect x="70" y="280" width="500" height="92" rx="14" fill="#e8f1ff" stroke="#7aa7e8"/>
  <text x="95" y="314" class="box-title">Read location.pathname</text>
  <text x="95" y="345" class="mono">/chat/{sessionId}</text>

  <path d="M320,374 L320,396" class="line"/>

  <rect x="70" y="398" width="500" height="72" rx="14" fill="#fff4e6" stroke="#f0ad4e"/>
  <text x="95" y="430" class="box-title">Path change detected</text>
  <text x="95" y="456" class="mono">chrome.runtime.sendMessage({ type: 'auth' })</text>

  <path d="M320,472 L320,496" class="line"/>

  <rect x="70" y="496" width="500" height="92" rx="14" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="95" y="530" class="box-title">Service Worker → connectSSE()</text>
  <text x="95" y="560" class="box-text">→ Open SSE connection · new session</text>

  <text x="70" y="625" class="small">Content Script watches URL changes, triggering auth &amp; SSE reconnect</text>

  <rect x="650" y="210" width="560" height="510" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="680" y="255" class="layer-title">New Tab</text>

  <rect x="680" y="280" width="500" height="92" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text x="705" y="314" class="box-title">Create new tab</text>
  <text x="705" y="345" class="mono">chrome.tabs.create({ url, active:false })</text>

  <path d="M930,374 L930,396" class="line"/>

  <rect x="680" y="398" width="500" height="72" rx="14" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="705" y="430" class="box-title">controlledTabId tracking</text>
  <text x="705" y="456" class="box-text">Extension remembers the controlled tab ID</text>

  <path d="M930,472 L930,496" class="line"/>

  <rect x="680" y="496" width="500" height="92" rx="14" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="705" y="530" class="box-title">tabId pass-through</text>
  <text x="705" y="560" class="box-text">LLM can target tabId to control multiple tabs</text>

  <text x="680" y="625" class="small">Allows the LLM to switch between multiple tabs</text>
</svg>
