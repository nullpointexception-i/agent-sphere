<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1000" viewBox="0 0 1250 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#1e293b; }
      .box-title { font: 700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#1e293b; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#334155; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#475569; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1250" height="1000" fill="url(#bg)"/>
  <text x="50" y="80" class="title">Fallback 执行流程</text>

  <!-- SessionRunner.runTurn -->
  <rect x="425" y="110" width="400" height="46" rx="23" fill="#334155"/>
  <text x="625" y="139" class="pill" text-anchor="middle">SessionRunner.runTurn()</text>

  <path d="M625 156 L625 186" class="line"/>

  <!-- resolveRoutes -->
  <rect x="175" y="186" width="900" height="120" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="175" y="186" width="900" height="44" rx="16" fill="#e8f1ff"/>
  <rect x="175" y="202" width="900" height="28" fill="#e8f1ff"/>
  <text x="200" y="217" class="box-title">resolveRoutes() → 构建路由列表</text>

  <text x="215" y="255" class="box-text">从 KernelContext 获取（直接指定）</text>
  <text x="215" y="285" class="box-text">从 Instance 获取（管理后台配置）</text>
  <text x="255" y="285" class="small">主路由 primary / Fallback 路由 fallbackIds</text>

  <path d="M625 306 L625 336" class="line"/>

  <!-- FallbackRouteExecutor -->
  <rect x="175" y="336" width="900" height="250" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="175" y="336" width="900" height="44" rx="16" fill="#eef2ff"/>
  <rect x="175" y="352" width="900" height="28" fill="#eef2ff"/>
  <text x="200" y="367" class="box-title">FallbackRouteExecutor.execute(routes)</text>

  <!-- Attempt 1 -->
  <rect x="200" y="400" width="850" height="50" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="220" y="420" class="box-text" font-weight="700">Attempt #1:</text>
  <text x="310" y="420" class="box-text">primary route</text>
  <path d="M510 405 L510 450" class="branch"/>
  <path d="M510 425 L510 430" class="line"/>

  <!-- Success -->
  <rect x="200" y="450" width="400" height="36" rx="18" fill="#75bd88"/>
  <text x="400" y="474" class="pill" text-anchor="middle">success → LLM 流 ✅</text>

  <!-- Exception -->
  <rect x="650" y="450" width="400" height="36" rx="18" fill="#f0ad4e"/>
  <text x="850" y="474" class="pill" text-anchor="middle">exception → log.warn → 自动切换</text>

  <!-- Attempt 2 -->
  <rect x="200" y="500" width="850" height="36" rx="10" fill="#fff4e6" stroke="#f0ad4e"/>
  <text x="220" y="524" class="box-text" font-weight="700">Attempt #2:</text>
  <text x="310" y="524" class="box-text">fallback 1 ...</text>

  <!-- All failed -->
  <rect x="200" y="548" width="850" height="36" rx="10" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="220" y="572" class="box-text" font-weight="700" fill="#ec4899">All failed →</text>
  <text x="330" y="572" class="box-text" fill="#ec4899">RuntimeException</text>

  <path d="M625 586 L625 616" class="line"/>

  <!-- compactionService.shouldCompact -->
  <rect x="175" y="616" width="900" height="130" rx="16" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="175" y="616" width="900" height="44" rx="16" fill="#edf7f6"/>
  <rect x="175" y="632" width="900" height="28" fill="#edf7f6"/>
  <text x="200" y="647" class="box-title">compactionService.shouldCompact()</text>

  <text x="215" y="690" class="box-text">使用实际 route 的 maxInputTokens 计算 budget</text>
  <text x="215" y="720" class="box-text">在 execute 回调内检测（确保和 LLM 调用同源）</text>

  <path d="M625 746 L625 776" class="line"/>

  <!-- End -->
  <rect x="425" y="776" width="400" height="46" rx="23" fill="#334155"/>
  <text x="625" y="805" class="pill" text-anchor="middle">runTurn 继续执行</text>
</svg>
