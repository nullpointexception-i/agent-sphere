<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .box-title { font: 700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#1e293b; }
      .box-text { font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#334155; }
      .mono { font: 400 13px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#475569; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.5; stroke-dasharray:8 8; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="50" y="80" class="title">Chrome Extension 浏览器桥接结构</text>

  <!-- Card 1: Content Script (页面上下文) -->
  <rect x="50" y="120" width="380" height="520" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="50" y="120" width="380" height="48" rx="22" fill="#4db6ac"/>
  <rect x="50" y="138" width="380" height="30" fill="#4db6ac"/>
  <text x="240" y="150" class="layer-title" text-anchor="middle" fill="#fff">Content Script（页面上下文）</text>

  <rect x="75" y="190" width="330" height="42" rx="10" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="240" y="212" class="box-text" text-anchor="middle">checkAuth() → localStorage 读取 token</text>

  <rect x="75" y="246" width="330" height="42" rx="10" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="240" y="268" class="box-text" text-anchor="middle">SSE 状态 Toast → 浮动提示</text>

  <rect x="75" y="302" width="330" height="42" rx="10" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="240" y="324" class="box-text" text-anchor="middle">domToJSON() → DOM → 结构化 JSON</text>

  <rect x="75" y="358" width="330" height="72" rx="10" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="240" y="382" class="box-text" text-anchor="middle">执行 click / type</text>
  <text x="240" y="402" class="box-text" text-anchor="middle">getContent / executeJS</text>

  <!-- Connect arrow -->
  <rect x="75" y="454" width="330" height="42" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="240" y="479" class="mono" text-anchor="middle" fill="#818cf8">chrome.runtime.sendMessage</text>

  <!-- Arrow pointing right -->
  <path d="M430 475 L490 475" class="line" marker-end="url(#arrow)"/>
  <text x="460" y="465" class="small" text-anchor="middle">▼</text>
  <text x="460" y="465" class="small" text-anchor="middle" dy="12">sendMessage</text>

  <!-- Card 2: Service Worker (后台) -->
  <rect x="500" y="120" width="370" height="520" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="500" y="120" width="370" height="48" rx="22" fill="#818cf8"/>
  <rect x="500" y="138" width="370" height="30" fill="#818cf8"/>
  <text x="685" y="150" class="layer-title" text-anchor="middle" fill="#fff">Service Worker（后台）</text>

  <rect x="525" y="190" width="320" height="56" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="685" y="214" class="box-text" text-anchor="middle">SSE 连接</text>
  <text x="685" y="234" class="box-text" text-anchor="middle">fetch + ReadableStream</text>

  <rect x="525" y="260" width="320" height="56" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="685" y="284" class="box-text" text-anchor="middle">会话跟随</text>
  <text x="685" y="304" class="box-text" text-anchor="middle">URL 变化自动重建 SSE</text>

  <rect x="525" y="330" width="320" height="56" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="685" y="354" class="box-text" text-anchor="middle">标签页管理</text>
  <text x="685" y="374" class="box-text" text-anchor="middle">受控标签页追踪 + tabId 透传</text>

  <rect x="525" y="400" width="320" height="56" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text x="685" y="424" class="box-text" text-anchor="middle">操作回调</text>
  <text x="685" y="444" class="mono" text-anchor="middle">POST /chrome/callback</text>

  <!-- Card 3: Popup (状态面板) -->
  <rect x="920" y="120" width="310" height="320" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="920" y="120" width="310" height="48" rx="22" fill="#475569"/>
  <rect x="920" y="138" width="310" height="30" fill="#475569"/>
  <text x="1075" y="150" class="layer-title" text-anchor="middle" fill="#fff">Popup（状态面板）</text>

  <rect x="945" y="190" width="260" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1075" y="217" class="box-text" text-anchor="middle">连接状态显示</text>

  <rect x="945" y="254" width="260" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1075" y="281" class="box-text" text-anchor="middle">URL 配置</text>

  <rect x="945" y="318" width="260" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1075" y="345" class="box-text" text-anchor="middle">操作日志</text>

  <!-- Arrow from Service Worker to Popup -->
  <path d="M870 475 L910 475" class="dash"/>
</svg>
