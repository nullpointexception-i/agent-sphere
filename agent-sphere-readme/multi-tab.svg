<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560" viewBox="0 0 1150 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
      .branch { stroke:#94a3b8; stroke-width:2.2; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1150" height="560" fill="url(#bg)"/>

  <text x="575" y="58" class="title" text-anchor="middle">Multi-Tab Management</text>
  <text x="575" y="86" class="small" text-anchor="middle">The LLM operates on multiple tabs via tabId</text>

  <rect x="465" y="108" width="220" height="44" rx="22" fill="#334155"/>
  <text x="575" y="136" class="pill" text-anchor="middle">LLM operates on two tabs</text>

  <path d="M575 152 L575 184" class="line"/>

  <rect x="70" y="184" width="500" height="252" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="320" y="220" class="layer-title" text-anchor="middle">Tab 1644814353 → GitHub</text>

  <rect x="95" y="238" width="450" height="74" rx="14" fill="#e8f1ff" stroke="#7aa7e8"/>
  <text x="320" y="266" class="box-title" text-anchor="middle">navigate</text>
  <text x="320" y="293" class="mono" text-anchor="middle">url: "https://github.com/..."</text>

  <path d="M320 312 L320 334" class="line"/>

  <rect x="95" y="334" width="450" height="84" rx="14" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="320" y="362" class="box-title" text-anchor="middle">getContent(tabId: 1644814353)</text>
  <text x="320" y="395" class="box-text" text-anchor="middle">→ returns GitHub page content</text>

  <rect x="610" y="184" width="500" height="252" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="860" y="220" class="layer-title" text-anchor="middle">Tab 1644814350 → Zhihu</text>

  <rect x="635" y="238" width="450" height="74" rx="14" fill="#e8f1ff" stroke="#7aa7e8"/>
  <text x="860" y="266" class="box-title" text-anchor="middle">navigate</text>
  <text x="860" y="293" class="mono" text-anchor="middle">url: "https://zhuanlan.zhihu.com/..."</text>

  <path d="M860 312 L860 334" class="line"/>

  <rect x="635" y="334" width="450" height="84" rx="14" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="860" y="362" class="box-title" text-anchor="middle">getContent(tabId: 1644814350)</text>
  <text x="860" y="395" class="box-text" text-anchor="middle">→ returns Zhihu page content</text>

  <path d="M575 436 L575 468" class="dash"/>

  <rect x="315" y="468" width="520" height="44" rx="22" fill="#475569"/>
  <text x="575" y="496" class="pill" text-anchor="middle">when no tabId → operate on the last navigated tab, controlledTabId</text>
</svg>
