<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
      .branch { stroke:#94a3b8; stroke-width:2.2; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>

  <text x="40" y="58" class="title">Multi-Turn Tool Call Example</text>
  <text x="40" y="86" class="small">Weather lookup: 4 ReAct loops · plan → navigate → read → parse → update → done</text>

  <rect x="241" y="120" width="718" height="100" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="265" y="150" width="90" height="40" rx="20" fill="#334155"/>
  <text x="310" y="176" class="pill" text-anchor="middle">Loop 0</text>
  <path d="M355,170 L385,170" class="line"/>
  <rect x="385" y="150" width="60" height="40" rx="12" fill="#818cf8"/>
  <text x="415" y="176" class="pill" text-anchor="middle">LLM</text>
  <path d="M445,170 L475,170" class="line"/>
  <rect x="475" y="150" width="175" height="40" rx="12" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="562" y="176" class="mono" text-anchor="middle">todowrite(create plan)</text>
  <path d="M650,170 L680,170" class="line"/>
  <rect x="680" y="150" width="60" height="40" rx="12" fill="#818cf8"/>
  <text x="710" y="176" class="pill" text-anchor="middle">LLM</text>
  <path d="M740,170 L770,170" class="line"/>
  <rect x="770" y="150" width="165" height="40" rx="12" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="852" y="176" class="mono" text-anchor="middle">navigate(weather site)</text>

  <path d="M600,222 L600,248" class="line"/>

  <rect x="366" y="250" width="468" height="100" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="390" y="280" width="90" height="40" rx="20" fill="#334155"/>
  <text x="435" y="306" class="pill" text-anchor="middle">Loop 1</text>
  <path d="M480,300 L510,300" class="line"/>
  <rect x="510" y="280" width="60" height="40" rx="12" fill="#818cf8"/>
  <text x="540" y="306" class="pill" text-anchor="middle">LLM</text>
  <path d="M570,300 L600,300" class="line"/>
  <rect x="600" y="280" width="210" height="40" rx="12" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="705" y="306" class="mono" text-anchor="middle">getContent(extract page structure)</text>

  <path d="M600,352 L600,378" class="line"/>

  <rect x="369" y="380" width="463" height="100" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="393" y="410" width="90" height="40" rx="20" fill="#334155"/>
  <text x="438" y="436" class="pill" text-anchor="middle">Loop 2</text>
  <path d="M483,430 L513,430" class="line"/>
  <rect x="513" y="410" width="60" height="40" rx="12" fill="#818cf8"/>
  <text x="543" y="436" class="pill" text-anchor="middle">LLM</text>
  <path d="M573,430 L603,430" class="line"/>
  <rect x="603" y="410" width="205" height="40" rx="12" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="705" y="436" class="mono" text-anchor="middle">executeJS(parse data)</text>

  <path d="M600,482 L600,508" class="line"/>

  <rect x="214" y="510" width="773" height="100" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="238" y="540" width="90" height="40" rx="20" fill="#334155"/>
  <text x="283" y="566" class="pill" text-anchor="middle">Loop 3</text>
  <path d="M328,560 L358,560" class="line"/>
  <rect x="358" y="540" width="60" height="40" rx="12" fill="#818cf8"/>
  <text x="388" y="566" class="pill" text-anchor="middle">LLM</text>
  <path d="M418,560 L448,560" class="line"/>
  <rect x="448" y="540" width="175" height="40" rx="12" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="535" y="566" class="mono" text-anchor="middle">todowrite(update status)</text>
  <path d="M623,560 L653,560" class="line"/>
  <rect x="653" y="540" width="60" height="40" rx="12" fill="#818cf8"/>
  <text x="683" y="566" class="pill" text-anchor="middle">LLM</text>
  <path d="M713,560 L743,560" class="line"/>
  <rect x="743" y="540" width="220" height="40" rx="12" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="853" y="566" class="mono" text-anchor="middle">stop(output result) ✅ done</text>
</svg>
