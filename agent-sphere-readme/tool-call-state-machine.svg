<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
      .branch { stroke:#94a3b8; stroke-width:2.2; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="600" fill="url(#bg)"/>

  <text x="95" y="72" class="title">工具调用记录状态机</text>
  <text x="95" y="100" class="box-text">ToolCallRecord Lifecycle · 状态流转</text>

  <circle cx="550" cy="140" r="9" fill="#475569"/>
  <path d="M550 149 L550 180" class="line"/>
  <text x="560" y="167" class="small">LLM 返回 tool_calls</text>

  <rect x="470" y="180" width="160" height="64" rx="32" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="220" class="box-title" text-anchor="middle">PENDING</text>

  <path d="M550 244 L550 310" class="line"/>
  <text x="560" y="282" class="small">FiberSet 执行</text>

  <rect x="470" y="310" width="160" height="64" rx="32" fill="#eef2ff" stroke="#818cf8"/>
  <text x="550" y="350" class="box-title" text-anchor="middle">RUNNING</text>

  <path d="M550 374 L550 430 L320 430 L320 480" class="line"/>
  <path d="M550 374 L550 430 L780 430 L780 480" class="line"/>
  <text x="435" y="422" class="small" text-anchor="middle">成功</text>
  <text x="665" y="422" class="small" text-anchor="middle">失败</text>

  <rect x="230" y="480" width="180" height="64" rx="32" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="320" y="520" class="box-title" text-anchor="middle">SUCCEEDED</text>

  <rect x="700" y="480" width="160" height="64" rx="32" fill="#fff4e6" stroke="#f0ad4e"/>
  <text x="780" y="520" class="box-title" text-anchor="middle">FAILED</text>
</svg>
