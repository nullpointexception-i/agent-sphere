<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
      .branch { stroke:#94a3b8; stroke-width:2.2; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="1610" fill="url(#bg)"/>

  <text x="60" y="72" class="title">Multi-level Memory System</text>
  <text x="60" y="100" class="box-text">Memory Level · six levels of storage, L1 to L6</text>

  <rect x="40" y="125" width="1120" height="1443" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="75" y="172" class="layer-title">Memory Level Hierarchy</text>

  <rect x="75" y="195" width="1050" height="166" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text x="105" y="229" class="box-title">L1: Runtime Context (KernelContext)</text>
  <text x="105" y="259" class="box-text">· KernelContext of current session (TTL: 30min)</text>
  <text x="105" y="285" class="box-text">· Contains tools, modelRoute, fallbackRoutes</text>
  <text x="105" y="311" class="box-text">· Stored in SessionRunner.contexts ConcurrentHashMap</text>
  <text x="105" y="337" class="box-text">· Removed automatically after run() ends</text>

  <path d="M600 366 L600 416" class="line"/>

  <rect x="75" y="421" width="1050" height="166" rx="14" fill="#e8f1ff" stroke="#7aa7e8"/>
  <text x="105" y="455" class="box-title">L2: Conversation Messages</text>
  <text x="105" y="485" class="box-text">· Current run's messages ArrayList (LLM sees exactly what's included)</text>
  <text x="105" y="511" class="box-text">· Contains system + user + assistant(tool_calls) + tool(result)</text>
  <text x="105" y="537" class="box-text">· Sent to LLM on each runTurn()</text>
  <text x="105" y="563" class="box-text">· Accumulates between loops; partially replaced by summary after compaction</text>

  <path d="M600 592 L600 642" class="line"/>

  <rect x="75" y="647" width="1050" height="166" rx="14" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="105" y="681" class="box-title">L3: LLM Interaction Record (agent_llm_interaction_record)</text>
  <text x="105" y="711" class="box-text">· Full record of each LLM call (request body, response, latency, status)</text>
  <text x="105" y="737" class="box-text">· Types: CHAT_REPLY / COMPACTION / TITLE_GENERATION</text>
  <text x="105" y="763" class="box-text">· Keeps original request and response bodies</text>
  <text x="105" y="789" class="box-text">· For debugging, auditing, performance analysis</text>

  <path d="M600 818 L600 868" class="line"/>

  <rect x="75" y="873" width="1050" height="218" rx="14" fill="#fff4e6" stroke="#f0ad4e"/>
  <text x="105" y="907" class="box-title">L4: Tool Call Record (agent_tool_call_record)</text>
  <text x="105" y="937" class="box-text">· Full record of each tool call</text>
  <text x="105" y="963" class="box-text">· Fields: callId, stepId, toolName, argumentsJson,</text>
  <text x="125" y="989" class="box-text">compressedArguments, artifact, compressedArtifact, status</text>
  <text x="105" y="1015" class="box-text">· Lifecycle: PENDING → RUNNING → SUCCEEDED / FAILED</text>
  <text x="105" y="1041" class="box-text">· Result compressed at write time (jsonCompress, 2000 char limit)</text>
  <text x="105" y="1067" class="box-text">· For HistoryLoader replay, observation panel display</text>

  <path d="M600 1096 L600 1146" class="line"/>

  <rect x="75" y="1151" width="1050" height="192" rx="14" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="105" y="1185" class="box-title">L5: Compact Summary (agent_compact_record)</text>
  <text x="105" y="1215" class="box-text">· Triggered when context tokens exceed budget</text>
  <text x="105" y="1241" class="box-text">· Structured summary generated by the dedicated summarizer model</text>
  <text x="105" y="1267" class="box-text">· Fields: compactedUptoRunId, summaryBefore, summaryAfter</text>
  <text x="105" y="1293" class="box-text">· Cursor: compactedUptoRunId marks compacted runs</text>
  <text x="105" y="1319" class="box-text">· HistoryLoader later skips compacted runs</text>

  <path d="M600 1348 L600 1398" class="line"/>

  <rect x="75" y="1403" width="1050" height="140" rx="14" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="105" y="1437" class="box-title">L6: Session Persistence (agent_session)</text>
  <text x="105" y="1467" class="box-text">· Metadata for one user session (title, summary, status)</text>
  <text x="105" y="1493" class="box-text">· Includes session-level summary (updated after compaction)</text>
  <text x="105" y="1519" class="box-text">· For session list display, run history linking</text>
</svg>
