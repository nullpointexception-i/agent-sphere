<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="620" viewBox="0 0 1260 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px "Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 16px "Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#1e293b; }
      .box-text { font: 400 14px "Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#334155; }
      .mono { font: 400 13px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#475569; }
      .small { font: 500 13px "Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1260" height="620" rx="16" fill="url(#bg)"/>
  <text x="40" y="46" class="title">Browser Operation Flow (Single-stream Delivery)</text>
  <text x="40" y="72" class="small">browser_operation delivered once on the user-level task stream; each commandId executed once</text>

  <!-- Backend run -->
  <g>
    <rect x="40" y="120" width="300" height="400" rx="14" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="56" y="148" class="box-title">Task / Dialog Run</text>
    <rect x="60" y="168" width="260" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="76" y="192" class="box-title">Chrome Tool</text>
    <text x="76" y="214" class="box-text">build ChromeCommandDTO</text>
    <text x="76" y="236" class="mono">commandId = UUID</text>
    <text x="76" y="258" class="mono">publishEvent → ChromeCommandEvent</text>
    <rect x="60" y="304" width="260" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="76" y="328" class="box-title">RuntimeEventListener</text>
    <text x="76" y="350" class="box-text">dispatch by session.created_by</text>
    <text x="76" y="372" class="mono">sendByUser(username, cmd)</text>
    <text x="76" y="394" class="small">delivered once on the user-level stream</text>
  </g>

  <line x1="340" y1="360" x2="520" y2="360" class="line"/>

  <!-- Extension -->
  <g>
    <rect x="520" y="120" width="300" height="400" rx="14" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="536" y="148" class="box-title">Chrome Extension</text>
    <rect x="540" y="168" width="260" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="556" y="192" class="box-title">task stream receive</text>
    <text x="556" y="214" class="mono">/api/v1/runtime/user/task/stream</text>
    <text x="556" y="236" class="box-text">handleSseData</text>
    <text x="556" y="258" class="box-text">read cmd.commandId / cmd.sessionId</text>
    <rect x="540" y="304" width="260" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="556" y="328" class="box-title">executeInPage</text>
    <text x="556" y="350" class="box-text">navigate / click / type / executeJS</text>
    <text x="556" y="372" class="box-text">inject content.js (&lt;all_urls&gt;)</text>
    <text x="556" y="394" class="box-text">each commandId executed once</text>
  </g>

  <line x1="820" y1="360" x2="1000" y2="360" class="line"/>

  <!-- Target page -->
  <g>
    <rect x="1000" y="240" width="220" height="240" rx="14" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="1016" y="268" class="box-title">Target tab</text>
    <rect x="1020" y="286" width="180" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1036" y="310" class="box-text">content.js runs DOM operations</text>
    <text x="1036" y="332" class="box-text">result + screenshot</text>
    <rect x="1020" y="392" width="180" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="1036" y="416" class="box-text">callback to backend</text>
    <text x="1036" y="436" class="mono">callback?sessionId=</text>
  </g>

  <!-- Callback back to backend -->
  <path d="M 1020 420 C 700 540, 400 500, 340 430" class="dash"/>
  <text x="600" y="560" class="small">callback → ChromePendingStore.complete(commandId) → tool future.get() returns ChromeResultVO</text>
</svg>
