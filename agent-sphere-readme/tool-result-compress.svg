<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="540" viewBox="0 0 1150 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
      .branch { stroke:#94a3b8; stroke-width:2.2; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1150" height="540" fill="url(#bg)"/>

  <text x="575" y="55" class="title" text-anchor="middle">Tool Result Write-Time Compression Flow</text>
  <text x="575" y="85" class="small" text-anchor="middle">After the tool executes successfully, compress the artifact; HistoryLoader directly reuses the compressed result</text>

  <rect x="40" y="110" width="1070" height="390" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="75" y="155" class="layer-title">Write-Time Compression · Reused on Read</text>

  <text x="110" y="190" class="small">① At write time (Runtime events)</text>

  <!-- Stage 1 -->
  <rect x="80" y="200" width="990" height="120" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text x="110" y="240" class="box-title">RuntimeEventListener.SUCCEEDED</text>
  <text x="110" y="270" class="box-text">→ <tspan class="mono">artifact</tspan> (raw) → written to <tspan class="mono">agent_tool_call_record.artifact</tspan></text>
  <text x="110" y="295" class="box-text">→ <tspan class="mono">jsonCompress(artifact, 2000)</tspan> → <tspan class="mono">.compressed_artifact</tspan></text>

  <path d="M575 320 L575 385" class="line"/>
  <text x="595" y="356" class="small">compressed and persisted</text>

  <text x="110" y="375" class="small">② On read (HistoryLoader load)</text>

  <!-- Stage 2 -->
  <rect x="80" y="385" width="990" height="95" rx="14" fill="#e9f8ef" stroke="#75bd88"/>
  <text x="110" y="425" class="box-title">HistoryLoader reads the compressed result</text>
  <text x="110" y="455" class="box-text">→ reads <tspan class="mono">.compressed_artifact</tspan> → used directly in <tspan class="mono">messages</tspan> (no re-compression)</text>
</svg>
