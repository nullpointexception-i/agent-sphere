<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="800" viewBox="0 0 1250 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .layer-title { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#162033; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#172033; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#536273; }
      .mono { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#334155; }
      .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#fff; }
      .code { font: 400 14px "SF Mono",Consolas,"Roboto Mono",monospace; fill:#1e293b; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:8 8; fill:none; marker-end:url(#arrow2); }
      .branch { stroke:#94a3b8; stroke-width:2.2; fill:none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1250" height="800" fill="url(#bg)"/>

  <text x="625" y="55" class="title" text-anchor="middle">Context Compaction</text>
  <text x="625" y="85" class="small" text-anchor="middle">When the estimated token count exceeds maxInputTokens × budget-ratio, trigger summary compaction and reassemble the context</text>

  <rect x="40" y="110" width="1170" height="635" rx="22" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Trigger pill -->
  <rect x="450" y="140" width="350" height="44" rx="22" fill="#334155"/>
  <text x="625" y="168" class="pill" text-anchor="middle">shouldCompact(messages, route) == true</text>

  <path d="M625 184 L625 220" class="line"/>
  <text x="645" y="206" class="small">trigger compaction</text>

  <!-- compact(...) box -->
  <rect x="80" y="220" width="1090" height="330" rx="14" fill="#eef2ff" stroke="#818cf8"/>
  <text x="110" y="258" class="box-title">compact(sessionId, runId, ctx)</text>
  <line x1="110" y1="272" x2="1140" y2="272" stroke="#cbd5e1" stroke-width="1"/>

  <text x="110" y="290" class="box-text"><tspan font-weight="700">1.</tspan> Load all runs after the cursor</text>
  <text x="110" y="314" class="box-text"><tspan font-weight="700">2.</tspan> Estimate tokens per run, newest to oldest</text>
  <text x="150" y="338" class="box-text">→ runs beyond <tspan class="mono">budget</tspan> are marked for compaction</text>
  <text x="110" y="362" class="box-text"><tspan font-weight="700">3.</tspan> <tspan class="mono">buildCompactInput</tspan> → concatenate <tspan class="mono">[User:] + Tool[] + [Assistant:]</tspan></text>
  <text x="150" y="386" class="box-text">→ tool results compressed with <tspan class="mono">jsonCompress(artifact, 500)</tspan></text>
  <text x="150" y="410" class="box-text">→ truncated by <tspan class="mono">compactionInputLimit (maxInputTokens × 0.5)</tspan></text>
  <text x="110" y="434" class="box-text"><tspan font-weight="700">4.</tspan> <tspan class="mono">callLLM</tspan> → dedicated summarizer generates the summary</text>
  <text x="150" y="458" class="box-text">→ <tspan class="mono">summaryMaxLen = inputToken × 2/3</tspan></text>
  <text x="150" y="482" class="box-text">→ prompt the LLM that output must be shorter than input</text>
  <text x="110" y="506" class="box-text"><tspan font-weight="700">5.</tspan> Write to <tspan class="mono">agent_compact_record</tspan></text>
  <text x="150" y="530" class="box-text">→ <tspan class="mono">compactedUptoRunId</tspan> = newest compacted run ID</text>

  <path d="M625 550 L625 585" class="line"/>
  <text x="645" y="571" class="small">reassemble after persisting</text>

  <!-- clear / reassemble box -->
  <rect x="80" y="585" width="1090" height="130" rx="14" fill="#edf7f6" stroke="#4db6ac"/>
  <text x="110" y="623" class="box-title">messages.clear() → reassemble</text>
  <text x="110" y="655" class="box-text">→ historyLoader now loads the compacted data</text>
  <text x="110" y="680" class="box-text">→ <tspan class="mono">shouldCompact</tspan> checks again → may need further compaction (up to 3 times)</text>
</svg>
